name: Deploy site

on:
  push:
    branches: [main, master]
    paths:
      - "personal-website/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "personal-website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build website
        run: python3 personal-website/scripts/build.py
      - name: Check content, links, and assets
        run: python3 personal-website/scripts/check.py
      - name: Save website for deployment or review
        uses: actions/upload-artifact@v4
        with:
          name: personal-website
          path: personal-website/dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download built website
        uses: actions/download-artifact@v4
        with:
          name: personal-website
          path: dist
      - name: Publish to existing Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
